bio: |
  Sanghoon Myung is a Principal Engineer at the Semiconductor R&D Center,
  Samsung Electronics, with 16+ years of experience spanning semiconductor
  device physics, TCAD modeling, and deep learning. His work focuses on
  physics-informed machine learning, compact modeling, hybrid TCAD–AI
  simulation, and semiconductor process and device optimization. He has
  published in venues including ICML, NeurIPS, IEDM, and the Symposium on
  VLSI Technology and Circuits, and is an inventor on multiple U.S. patents.

