experience:
  - role: Principal Engineer
    org: Samsung Electronics — Semiconductor R&D Center
    start: 2010-01-01
    summary: |
      Since 2018, leading research that bridges deep learning and semiconductor
      physics for device and compact model development. Developed automated
      pipelines for TCAD data generation and AI model training, calibration
      methods that align AI models with measurements, and process digital twins
      integrating TCAD, measurement data, and deep learning. Leads teams of
      4–5 engineers in model development and deployment.

      From 2010 to 2017, worked as a TCAD Device Engineer on CMOS image sensors,
      power devices, SRAM junction engineering, and 14 nm FinFET process and
      device optimization.

